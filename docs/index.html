<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rare Friends: Impostor Protocol</title><link rel="stylesheet" href="./runtime.css"><link rel="stylesheet" href="./layout.css"><style>/* Fill the screen instead of the SDK's default 960px ceiling: with a 3:2 frame the
   width may be at most 1.5x the viewport height, so this takes whichever dimension
   binds. On a phone it resolves to the full width (already the 3:2 maximum); on a
